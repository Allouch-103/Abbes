# ============================================================
# controllers.yaml — ros2_control joint controllers
# Used by: gz_ros2_control plugin in Gazebo Harmonic
# ============================================================

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    leg_effort_controller:
      type: forward_command_controller/ForwardCommandController

    # ── Declare all controllers ────────────────────────────
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: forward_command_controller/ForwardCommandController

    arm_controller:
      type: forward_command_controller/ForwardCommandController

    head_controller:
      type: forward_command_controller/ForwardCommandController


# ── joint_state_broadcaster config ────────────────────────
# Empty: JSB auto-discovers all joints and interfaces
# from the resource manager. Specifying 'joints' + 'interfaces'
# together causes init_joint_data() to crash in Jazzy.
joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity

# ── leg_controller config ─────────────────────────────────
leg_controller:
  ros__parameters:
    joints:
      - r_hip_roll
      - r_hip_pitch
      - r_knee_pitch
      - r_ankle_pitch
      - r_ankle_roll
      - l_hip_roll
      - l_hip_pitch
      - l_knee_pitch
      - l_ankle_pitch
      - l_ankle_roll
    interface_name: position


# ── arm_controller config ─────────────────────────────────
arm_controller:
  ros__parameters:
    joints:
      - r_shoulder_pitch
      - r_shoulder_roll
      - r_elbow_roll
      - l_shoulder_pitch
      - l_shoulder_roll
      - l_elbow_roll
    interface_name: position


# ── head_controller config ────────────────────────────────
head_controller:
  ros__parameters:
    joints:
      - head_yaw
      - camera_pitch
    interface_name: position


leg_effort_controller:
  ros__parameters:
    joints: [r_hip_roll, r_hip_pitch, r_knee_pitch, r_ankle_pitch, r_ankle_roll, l_hip_roll, l_hip_pitch, l_knee_pitch, l_ankle_pitch, l_ankle_roll]
    interface_name: effort
