; ============================================================
; HUMANOID ROBOT — PlatformIO Configuration (ROS2 Jazzy)
; ============================================================

[env:esp32dev]

platform  = espressif32
board     = esp32dev
framework = arduino

upload_speed  = 115200
monitor_speed = 115200

; ── micro-ROS distro and transport ───────────────────────
board_microros_distro    = jazzy
board_microros_transport = wifi_udp

; ── Libraries ────────────────────────────────────────────
; REMOVED: Adafruit MPU6050, Adafruit Unified Sensor, Adafruit BusIO
; IMU is now handled via raw I2C (mpu6050_raw.cpp) — no library needed
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1

; Build everything EXCEPT the standalone single-servo test, which has
; its own setup()/loop() and is built only by [env:servo_test].
build_src_filter =
    +<*>
    -<servo_one_test.cpp>

; ── Partition scheme ─────────────────────────────────────
board_build.partitions = huge_app.csv

; ── Build flags ──────────────────────────────────────────
build_flags =
    -DCONFIG_MICRO_ROS_APP_STACK=16000
    -DCONFIG_MICRO_ROS_APP_TASK_PRIO=5
    -O2
    -I .pio/libdeps/esp32dev/micro_ros_platformio/platform_code/arduino/wifi
    -I .pio/libdeps/esp32dev/micro_ros_platformio/libmicroros/include

; ── Monitor filters ──────────────────────────────────────
monitor_filters = colorize, time


; ============================================================
; [env:servo_test] — STANDALONE single-servo test
; ============================================================
; No micro-ROS, no WiFi. Builds ONLY src/servo_one_test.cpp plus the
; Adafruit PCA9685 library. Use it to verify wiring/power on one servo.
;   pio run -e servo_test -t upload
;   pio device monitor -e servo_test
[env:servo_test]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_speed  = 115200
monitor_speed = 115200

; Only the Adafruit PWM driver — NO micro-ROS dependency.
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1

; Compile ONLY the standalone test file (skip all micro-ROS sources).
build_src_filter =
    -<*>
    +<servo_one_test.cpp>

monitor_filters = colorize, time